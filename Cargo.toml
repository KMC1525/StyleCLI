[package]
name = "style"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Gera datasets JSONL de estilo a partir de imagens, artes e quadrinhos (SFW/NSFW) com um modelo de visão local leve"
license = "MIT"
repository = "https://github.com/KMC1525/StyleCLI"
readme = "README.md"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
ctrlc = "3.5.3"
dirs = "7.0.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
indicatif = "0.18.6"
num_cpus = "1.17.0"
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
unrar = "0.5.8"
ureq = { version = "3.5.2", features = ["json", "platform-verifier"] }
walkdir = "2.5.1"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
